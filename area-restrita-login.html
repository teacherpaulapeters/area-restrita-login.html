<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área Restrita — Teacher Paula Peters</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --lilac:#957d9b;--lilac-l:#F0EBF3;--lilac-d:#725878;--lilac-ll:#FAF7FB;
  --cream:#FAF8F5;--white:#FFFFFF;
  --text:#1A1714;--text2:#5C5750;--text3:#9C9690;
  --border:#E2DBE5;--border2:#C8BDCd;
  --r8:8px;--r12:12px;--r16:16px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);}
body{display:flex;align-items:center;justify-content:center;padding:20px;}

.login-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r16);padding:40px;
  width:100%;max-width:420px;
  box-shadow:0 4px 32px rgba(149,125,155,.10);
}

.login-brand{text-align:center;margin-bottom:32px;}
.login-logo{
  width:48px;height:48px;background:var(--lilac);
  border-radius:12px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-weight:600;color:#fff;font-size:22px;
}
.login-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--text3);letter-spacing:.4px;}

.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.form-field input{
  width:100%;padding:11px 14px;
  border:1px solid var(--border);border-radius:var(--r8);
  background:var(--cream);font-family:'DM Sans',sans-serif;
  font-size:14px;color:var(--text);outline:none;
  transition:border-color .15s;
}
.form-field input:focus{border-color:var(--lilac);}

.btn-login{
  width:100%;padding:13px;margin-top:8px;
  background:var(--lilac);color:#fff;border:none;
  border-radius:var(--r8);font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:500;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:var(--lilac-d);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}

.error-box{
  background:#FEF2F2;border:1px solid #FCA5A5;border-radius:var(--r8);
  padding:10px 14px;font-size:12px;color:#991B1B;
  margin-top:12px;display:none;line-height:1.5;
}

.login-footer{text-align:center;margin-top:20px;font-size:12px;color:var(--text3);}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">P</div>
    <div class="login-title">Área Restrita</div>
    <div class="login-sub">Teacher Paula Peters™</div>
  </div>

  <div class="form-field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" />
  </div>

  <div class="form-field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()" />
  </div>

  <button class="btn-login" id="btn-entrar" onclick="entrar()">Entrar</button>

  <div class="error-box" id="error-box"></div>

  <div class="login-footer">☕ Helping people believe they can learn</div>
</div>

<script>
const SUPABASE_URL = 'https://zrcnhegjgfqfxshzfkia.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY25oZWdqZ2ZxZnhzaHpma2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NDY4NjIsImV4cCI6MjEwMjMyMjg2Mn0.QYABB_-iJxryDYRkJoF9oPey6YAsf52oORC6sM0UmRI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Redireciona se já logado
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'index.html';
});

async function entrar() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn   = document.getElementById('btn-entrar');
  const err   = document.getElementById('error-box');

  err.style.display = 'none';

  if (!email || !senha) {
    err.textContent = 'Preencha e-mail e senha para continuar.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Entrando...';

  const { error } = await supabase.auth.signInWithPassword({ email, password: senha });

  if (error) {
    err.textContent = 'E-mail ou senha incorretos. Tente novamente.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = 'Entrar';
  } else {
    window.location.href = 'index.html';
  }
}
</script>
</body>
</html>
