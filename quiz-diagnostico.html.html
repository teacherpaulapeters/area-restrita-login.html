<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Diagnóstico — Teacher Paula</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--lilac:#957d9b;--lilac-l:#F0EBF3;--lilac-d:#725878;--cream:#FAF8F5;--white:#FFFFFF;--text:#1A1714;--text2:#5C5750;--text3:#9C9690;--border:#E2DBE5;--r8:8px;--r12:12px;--r16:16px;}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);}
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 5vw;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-logo{width:28px;height:28px;background:var(--lilac);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:#fff;font-size:14px;}
.nav-name{font-size:13px;font-weight:500;color:var(--text);}
.btn-voltar{padding:5px 12px;border-radius:var(--r8);border:1px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text2);cursor:pointer;text-decoration:none;transition:all .15s;}
.btn-voltar:hover{background:var(--cream);}
.main{max-width:820px;margin:0 auto;padding:36px 5vw 80px;}
.agent-hero{background:var(--white);border:1px solid var(--border);border-radius:var(--r16);padding:22px;margin-bottom:20px;display:flex;align-items:flex-start;gap:14px;}
.agent-hero-icon{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#FDF0DC;}
.hero-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:4px;}
.hero-desc{font-size:13px;color:var(--text2);line-height:1.6;}
.hero-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;margin-top:7px;background:#FDF0DC;color:#B06D10;}
.dot{width:5px;height:5px;border-radius:50%;background:#B06D10;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r12);padding:20px;margin-bottom:14px;}
.card-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.full{grid-column:1/-1;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:500;color:var(--text2);}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r8);background:var(--cream);color:var(--text);width:100%;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--lilac);}
textarea{min-height:80px;resize:vertical;line-height:1.5;}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.check-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);cursor:pointer;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r8);transition:all .1s;background:var(--cream);}
.check-label:hover{border-color:var(--border2);}
.check-label input{width:14px;height:14px;cursor:pointer;}
.run-btn{width:100%;padding:13px;border-radius:var(--r12);border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:#B06D10;}
.run-btn:hover{filter:brightness(1.08);}
.run-btn:disabled{opacity:.5;cursor:not-allowed;}
.output-box{margin-top:16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r12);overflow:hidden;display:none;}
.output-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--cream);}
.output-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.copy-btn{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;}
.copy-btn:hover{background:var(--cream);}
.output-body{padding:20px;font-size:13px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:600px;overflow-y:auto;}
.output-body.loading{color:var(--text3);font-style:italic;display:flex;align-items:center;gap:10px;}
.error-box{display:none;background:#F5EEF7;border:1px solid #C9B3CF;border-radius:var(--r8);padding:10px 14px;font-size:12px;color:#5E4466;line-height:1.5;margin-top:12px;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
.spin-dark{border-color:rgba(0,0,0,.15);border-top-color:var(--text2);}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.full{grid-column:1}.check-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-left">
    <div class="nav-logo">P</div>
    <span class="nav-name">Teacher Paula OS</span>
  </div>
  <a class="btn-voltar" href="index.html">← Voltar ao painel</a>
</nav>

<div class="main">
  <div class="agent-hero">
    <div class="agent-hero-icon">🧪</div>
    <div>
      <div class="hero-title">Quiz Diagnóstico</div>
      <div class="hero-desc">Gere um quiz interativo que identifica o nível A1–C2, produz diagnóstico personalizado e converte o visitante em lead qualificado.</div>
      <span class="hero-badge"><span class="dot"></span>Agente ativo</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Configuração</div>
    
    <div class="grid2">
      <div class="field"><label>Público-alvo</label><select id="q-pub"><option>Adultos em geral</option><option>Profissionais de negócios</option><option>Universitários</option><option>Adolescentes</option></select></div>
      <div class="field"><label>Tom</label><select id="q-tom"><option>Divertido e descontraído</option><option>Acolhedor e motivador</option><option>Profissional e direto</option></select></div>
      <div class="field"><label>Quantidade de questões</label><select id="q-qtd"><option>10 questões (rápida)</option><option>15 questões (completa)</option><option>20 questões (detalhada)</option></select></div>
      <div class="field"><label>CTA final</label><input id="q-cta" placeholder="Ex: Agende sua aula diagnóstica gratuita" /></div>
    </div>
  </div>

  <button class="run-btn" id="btn-agent" onclick="runAgent()">✨ Gerar com IA</button>
  <div class="error-box" id="err-agent"></div>
  <div class="output-box" id="out-agent">
    <div class="output-top">
      <span class="output-label">📋 Quiz Diagnóstico — Resultado</span>
      <button class="copy-btn" onclick="copyText('body-agent',this)">Copiar</button>
    </div>
    <div class="output-body" id="body-agent"></div>
  </div>
</div>

<script>
const _sb = window.supabase.createClient('https://zrcnhegjgfqfxshzfkia.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY25oZWdqZ2ZxZnhzaHpma2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NDY4NjIsImV4cCI6MjEwMjMyMjg2Mn0.QYABB_-iJxryDYRkJoF9oPey6YAsf52oORC6sM0UmRI');
_sb.auth.getSession().then(({data})=>{ if(!data.session) window.location.href='login.html'; });

const ANTHROPIC_KEY = 'SUA_CHAVE_ANTHROPIC_AQUI';
const SYSTEM = `Você é especialista em diagnóstico linguístico da Teacher Paula Peters. Crie quizzes de inglês divertidos e acolhedores em português brasileiro.`;

async function callClaude(prompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,system:SYSTEM,messages:[{role:'user',content:prompt}]})
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'Erro na API ('+res.status+')');}
  const d=await res.json();
  const t=d.content?.find(b=>b.type==='text')?.text;
  if(!t) throw new Error('Resposta vazia.');
  return t;
}

async function run(prompt) {
  document.getElementById('err-agent').style.display='none';
  const btn=document.getElementById('btn-agent');
  const out=document.getElementById('out-agent');
  const body=document.getElementById('body-agent');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Gerando com IA...';
  out.style.display='block';body.className='output-body loading';
  body.innerHTML='<span class="spin spin-dark"></span> A IA está trabalhando...';
  try {
    const result = await callClaude(prompt);
    body.className='output-body';body.textContent=result;
  } catch(e) {
    document.getElementById('err-agent').textContent='⚠️ '+e.message;
    document.getElementById('err-agent').style.display='block';
    out.style.display='none';
  }
  btn.disabled=false;btn.innerHTML='✨ Gerar com IA';
}

async function runAgent() {
  const pub=document.getElementById('q-pub').value;
  const tom=document.getElementById('q-tom').value;
  const qtd=document.getElementById('q-qtd').value;
  const cta=document.getElementById('q-cta').value.trim()||'Agende sua aula diagnóstica com a Teacher Paula';
  const prompt=`Crie um quiz de inglês: Público: ${pub} | Tom: ${tom} | Quantidade: ${qtd} | CTA: ${cta}\n\nEstrutura OBRIGATÓRIA:\n🎯 ETAPA 1 — OBJETIVOS (2 perguntas)\n——————\n🪞 ETAPA 2 — AUTOAVALIAÇÃO (2 perguntas)\n——————\n📖 ETAPA 3 — VOCABULÁRIO (3 questões com 4 opções + resposta correta)\n——————\n✏️ ETAPA 4 — GRAMÁTICA (3 questões + resposta correta)\n——————\n👁 ETAPA 5 — COMPREENSÃO (mini-texto + 2 perguntas)\n——————\n🖊 ETAPA 6 — PRODUÇÃO (1 pergunta aberta)\n——————\n🏆 RESULTADO POR NÍVEL (A1/A2/B1/B2/C1/C2 com pontuação, pontos fortes e próximos passos)\n——————\n📣 CHAMADA PARA AÇÃO: ${cta}`;
  await run(prompt);
}

async function copyText(id,btn) {
  try{await navigator.clipboard.writeText(document.getElementById(id).textContent);btn.textContent='✓ Copiado!';setTimeout(()=>btn.textContent='Copiar',2000);}catch(e){}
}
</script>
</body>
</html>
